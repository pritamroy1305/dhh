  }
  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(to top, rgba(10,7,5,0.72) 0%, rgba(10,7,5,0.25) 16%, rgba(10,7,5,0) 34%),
      linear-gradient(to bottom, rgba(10,7,5,0.35) 0%, rgba(10,7,5,0) 18%);
  }

  /* ================= INTRO OVERLAY ================= */
  .intro{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    background:rgba(10,7,5,0.38);
    backdrop-filter:blur(2px);
    transition:opacity 0.6s ease, visibility 0.6s ease;
  }
  .intro.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro-card{
    background:rgba(28,20,15,0.55);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--glass-border);
    border-radius:20px;
    box-shadow:var(--glass-shadow);
    padding:34px 40px;
    text-align:center;
    cursor:pointer;
    transition:transform 0.25s ease, background 0.25s ease;
    user-select:none;
    max-width:min(84vw,360px);
  }
  .intro-card:hover{ transform:translateY(-2px); background:rgba(28,20,15,0.68); }
  .intro-card:active{ transform:translateY(1px) scale(0.98); }
  .intro-disc{
    width:52px;height:52px;margin:0 auto 16px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, var(--ink) 0 18%, var(--brass) 19% 21%, var(--ink) 22% 100%);
    box-shadow:0 0 0 2px rgba(239,226,195,0.25), 0 6px 18px rgba(0,0,0,0.5);
    animation:spin 6s linear infinite;
  }
  .intro-title{
    font-family:'Anton',sans-serif;
    font-size:20px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--parchment);
    margin:0 0 6px;
  }
  .intro-sub{
    font-size:12.5px;
    letter-spacing:0.04em;
    color:rgba(239,226,195,0.65);
    margin:0;
  }

  /* ================= TOP BAR ================= */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:15;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--pill-bg);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    border:1px solid var(--pill-border);
    border-radius:999px;
    padding:9px 17px;
    font-size:13.5px;
    line-height:1.2;
    min-height:34px;
    letter-spacing:0.02em;
    color:var(--parchment);
    white-space:nowrap;
  }
  .pill-group{ display:flex; gap:8px; align-items:center; }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#3ddc72;
    box-shadow:0 0 6px rgba(61,220,114,0.9);
    flex-shrink:0;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  .pill-link{
    text-decoration:none;
    color:var(--parchment);
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .pill-link:hover{ background:rgba(20,14,10,0.4); }
  .pill-link:active{ transform:scale(0.97); }
  .pill-link svg{ width:11px;height:11px; opacity:0.75; }

  @media (max-width:560px){
    .topbar{ padding:12px 12px; }
    .pill{ font-size:10.5px; padding:5px 10px; }
    .pill span.pill-full{ display:none; }
  }

  /* ================= PLAYER DOCK ================= */
  .dock-wrap{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px));
    z-index:20;
  }
  .dock{
    width:100%;
    max-width:760px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:18px;
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid var(--glass-border);
    border-radius:22px;
    box-shadow:var(--glass-shadow);
    padding:12px 16px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s;
  }
  .dock.show{ opacity:1; transform:translateY(0); }

  /* platter */
  .platter{
    width:54px;height:54px;
    border-radius:50%;
    position:relative;
    flex-shrink:0;
    background:
      radial-gradient(circle at 50% 50%, var(--ink) 0 26%, transparent 27%),
      conic-gradient(from 0deg, #221913 0deg, #2c211a 10deg, #221913 20deg, #2c211a 30deg, #221913 40deg, #2c211a 50deg, #221913 60deg, #2c211a 70deg, #221913 80deg, #2c211a 90deg, #221913 100deg, #2c211a 110deg, #221913 120deg, #2c211a 130deg, #221913 140deg, #2c211a 150deg, #221913 160deg, #2c211a 170deg, #221913 180deg, #2c211a 190deg, #221913 200deg, #2c211a 210deg, #221913 220deg, #2c211a 230deg, #221913 240deg, #2c211a 250deg, #221913 260deg, #2c211a 270deg, #221913 280deg, #2c211a 290deg, #221913 300deg, #2c211a 310deg, #221913 320deg, #2c211a 330deg, #221913 340deg, #2c211a 350deg, #221913 360deg);
    box-shadow:0 0 0 2px rgba(239,226,195,0.18), inset 0 0 10px rgba(0,0,0,0.6);
    animation:spin 3.2s linear infinite;
    animation-play-state:paused;
  }
  .platter.playing{ animation-play-state:running; }
  .platter-label{
    position:absolute; inset:16px;
    border-radius:50%;
    background-size:cover;
    background-position:center;
    background-color:var(--brass);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,0.4);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* track info + progress */
  .track-col{ min-width:0; }
  .marquee{ overflow:hidden; white-space:nowrap; position:relative; }
  .track-title{
    font-weight:700;
    font-size:14px;
    color:var(--parchment);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
  }
  .track-artist{
    font-size:11.5px;
    color:rgba(239,226,195,0.6);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
    margin-top:1px;
  }

  .transport{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }
  .tbtn{
    background:transparent;
    border:none;
    color:var(--parchment);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;height:30px;
    border-radius:50%;
    flex-shrink:0;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .tbtn:hover{ background:rgba(239,226,195,0.12); }
  .tbtn:active{ transform:scale(0.92); }
  .tbtn.play{
    width:36px;height:36px;
    background:var(--neon);
    color:var(--ink);
  }
  .tbtn.play:hover{ background:#ff5b4c; }
  .tbtn svg{ width:15px;height:15px; }
  .tbtn.play svg{ width:16px;height:16px; }

  .seek-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0;
  }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:3px;
    border-radius:3px;
    background:rgba(239,226,195,0.22);
    outline:none;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--parchment);
    box-shadow:0 0 0 3px rgba(239,226,195,0.18);
    margin-top:0;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px;height:11px;border:none;border-radius:50%;
    background:var(--parchment);
    box-shadow:0 0 0 3px rgba(239,226,195,0.18);
  }
  #seek{ flex:1; }
  .time-label{
    font-family:'VT323', monospace;
    font-size:15px;
    color:var(--lcd);
    min-width:34px;
    text-align:center;
    letter-spacing:0.02em;
  }

  .vol-row{ display:flex; align-items:center; gap:6px; }
  #vol{ width:64px; }

  /* LCD panel — signature element */
  .lcd-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .lcd{
    font-family:'VT323', monospace;
    background:linear-gradient(180deg, #0e0b08 0%, #171310 100%);
    border:1px solid rgba(0,0,0,0.6);
    border-radius:6px;
    box-shadow:inset 0 0 6px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,184,51,0.06);
    padding:5px 10px;
    text-align:center;
    position:relative;
    overflow:hidden;
    min-width:58px;
  }
  .lcd::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,184,51,0.05) 0px,
      rgba(255,184,51,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }
  .lcd-track{
    font-size:18px;
    color:var(--lcd);
    text-shadow:0 0 6px rgba(255,184,51,0.55);
    line-height:1.1;
    letter-spacing:0.04em;
  }
  .lcd-label{
    font-size:8.5px;
    letter-spacing:0.14em;
    color:rgba(239,226,195,0.42);
    text-transform:uppercase;
    font-family:'Space Grotesk',sans-serif;
    margin-top:1px;
  }

  .icon-mute{ width:15px;height:15px;flex-shrink:0;color:rgba(239,226,195,0.7); cursor:pointer; }

  /* ================= RESPONSIVE ================= */
  @media (max-width:768px){
    .scene{ background-position:center 18%; }
    .dock-wrap{ padding:0 10px calc(14px + env(safe-area-inset-bottom,0px)); }
    .dock{
      grid-template-columns:auto 1fr;
      grid-template-rows:auto auto;
      row-gap:10px;
      border-radius:20px;
      padding:12px 14px;
    }
    .platter{ grid-row:1 / span 2; width:46px;height:46px; }
    .track-col{ grid-column:2; grid-row:1; }
    .lcd-col{
      grid-column:2; grid-row:2;
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      width:100%;
    }
    .transport .tbtn{ width:44px;height:44px; }
    .transport .tbtn.play{ width:48px;height:48px; }
    .transport .tbtn svg{ width:17px;height:17px; }
    .transport .tbtn.play svg{ width:19px;height:19px; }
    .vol-row{ display:none; }
    .lcd{ min-width:auto; padding:4px 9px; }
    .lcd-track{ font-size:16px; }
  }

  @media (max-width:400px){
    .intro-card{ padding:26px 26px; }
  }

  /* focus visibility */
  button:focus-visible, input:focus-visible, .intro-card:focus-visible{
    outline:2px solid var(--lcd);
    outline-offset:2px;
  }

  .logo-image{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:min(40vw, 280px);
    max-width:280px;
    opacity:0.65;
    pointer-events:none;
    z-index:5;
  }
</style>
</head>
<body>

<div class="scene" id="scene"></div>
<div class="vignette"></div>

<div class="topbar">
  <div class="pill" id="clockPill">
    <span id="clockTime">--:--</span>
  </div>
  <div class="pill-group">
    <div class="pill">
      <span class="dot"></span>
      <span id="onlineCount">—</span>
      <span class="pill-full">&nbsp;online</span>
    </div>
    <a class="pill pill-link" href="https://youtube.com/playlist?list=PL5o3IhqKHiwgeKLs4isiqon45TiEi27rb&si=scguODfhUrR1LDTa" target="_blank" rel="noopener">
      <span class="pill-full">YT Playlist</span><span aria-hidden="true">↗</span>
    </a>
  </div>
</div>

<div class="intro" id="intro">
  <div class="intro-card" id="introCard" role="button" tabindex="0" aria-label="Tap to start the music">
    <div class="intro-disc"></div>
    <p class="intro-title">Tap to drop the beat</p>
    <p class="intro-sub">Real roots. Desi beats. Desi vibes.</p>
  </div>
</div>

<div class="dock-wrap">
  <div class="dock" id="dock">
    <div class="platter" id="platter">
      <div class="platter-label" id="platterLabel"></div>
    </div>

    <div class="track-col">
      <div class="marquee">
        <span class="track-title" id="trackTitle">Loading playlist…</span>
      </div>
      <span class="track-artist" id="trackArtist">Desi Hip Hop</span>

      <div class="transport">
        <button class="tbtn" id="prevBtn" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
        </button>
        <button class="tbtn play" id="playBtn" aria-label="Play or pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="nextBtn" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>

        <div class="seek-row">
          <span class="time-label" id="curTime">0:00</span>
          <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek">
          <span class="time-label" id="durTime">0:00</span>
        </div>

        <div class="vol-row">
          <svg class="icon-mute" id="muteBtn" viewBox="0 0 24 24" fill="currentColor" aria-label="Mute">
            <path d="M3 10v4h4l5 5V5L7 10H3z"/>
          </svg>
          <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume">
        </div>
      </div>
    </div>

    <div class="lcd-col">
      <div class="lcd">
        <div class="lcd-track" id="lcdTrack">00/00</div>
        <div class="lcd-label">TRACK</div>
      </div>
    </div>
  </div>
</div>

<img class="logo-image" src="dhh.png" alt="D.H.H Logo">
<div id="ytframe"></div>

<script>
(function(){
  var PLAYLIST_ID = "PLdiYMjm3mZRvS0G0TozgmQ8G61LazHU0Z";

  var scene = document.getElementById('scene');
  var intro = document.getElementById('intro');
  var introCard = document.getElementById('introCard');
  var dock = document.getElementById('dock');
  var platter = document.getElementById('platter');
  var platterLabel = document.getElementById('platterLabel');
  var trackTitle = document.getElementById('trackTitle');
  var trackArtist = document.getElementById('trackArtist');
  var playBtn = document.getElementById('playBtn');
  var playIcon = document.getElementById('playIcon');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var seek = document.getElementById('seek');
  var curTime = document.getElementById('curTime');
  var durTime = document.getElementById('durTime');
  var vol = document.getElementById('vol');
  var muteBtn = document.getElementById('muteBtn');
  var lcdTrack = document.getElementById('lcdTrack');
  var clockTime = document.getElementById('clockTime');
  var onlineCount = document.getElementById('onlineCount');
  var ytframe = document.getElementById('ytframe');

  var ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  var ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  var isSeeking = false;
  var isMuted = false;
  var lastVol = 70;
  var started = false;
  var ready = false;
  var curDuration = 0;
  var lastVideoId = null;
  var progressTimer = null;
  var player = null;
  var playlistVideos = [];

  function fmt(t){
    t = Math.max(0, Math.floor(t||0));
    var m = Math.floor(t/60), s = t%60;
    return m + ':' + (s<10 ? '0'+s : s);
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }

  /* ---------- clock ---------- */
  function updateClock(){
    var s = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    clockTime.textContent = s.toLowerCase();
  }
  updateClock();
  setInterval(updateClock, 15000);

  /* ---------- ambient "online" count ----------
     No backend in this static file, so this is a gently
     drifting ambient number rather than real cross-visitor
     presence — wire up Supabase Realtime Presence if you want
     an actually-live count. */
  var onlineN = 14 + Math.floor(Math.random()*20);
  onlineCount.textContent = onlineN;
  setInterval(function(){
    onlineN += (Math.random() < 0.5 ? -1 : 1);
    onlineN = Math.max(6, Math.min(54, onlineN));
    onlineCount.textContent = onlineN;
  }, 9000 + Math.random()*6000);

  /* ---------- parallax (desktop only, respects reduced motion) ---------- */
  var canParallax = window.matchMedia('(pointer:fine)').matches &&
                     !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (canParallax){
    window.addEventListener('mousemove', function(e){
      var x = (e.clientX / window.innerWidth - 0.5) * 2;
      var y = (e.clientY / window.innerHeight - 0.5) * 2;
      scene.style.transform = 'translate(' + (x*-8) + 'px,' + (y*-5) + 'px) scale(1.03)';
    });
  }

  /* ---------- YouTube Player API (no iframe embed) ---------- */
  // Load YouTube IFrame API
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var playerReady = false;
  var currentVideoIndex = 0;

  // YouTube API callback - when API is ready
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('ytframe', {
      height: '220',
      width: '100%',
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange,
        'onError': onPlayerError
      },
      playerVars: {
        autoplay: 0,
        controls: 1,
        modestbranding: 1,
        rel: 0,
        iv_load_policy: 3,
        playsinline: 1,
        list: PLAYLIST_ID
      }
    });
    playerReady = true;
    loadPlaylist();
  };

  function onPlayerReady(event) {
    ready = true;
    event.target.setVolume(70);
  }

  function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.PLAYING) {
      playIcon.innerHTML = ICON_PAUSE;
      platter.classList.add('playing');
    } else if (event.data == YT.PlayerState.PAUSED) {
      playIcon.innerHTML = ICON_PLAY;
      platter.classList.remove('playing');
    } else if (event.data == YT.PlayerState.ENDED) {
      nextTrack();
    }
  }

  function onPlayerError(event) {
    console.error('YouTube player error:', event.data);
  }

  function loadPlaylist() {
    // YouTube playlist mode automatically handles sequential playback
    // with the 'list' parameter in playerVars
    trackTitle.textContent = 'Desi Hip Hop Playlist';
    trackArtist.textContent = 'Playlist ready';
    lcdTrack.textContent = '01/--';
  }

  function updateTrackInfo() {
    if (playlistVideos.length === 0) return;
    var video = playlistVideos[currentVideoIndex];
    trackTitle.textContent = video.title;
    trackArtist.textContent = video.artist;
    lcdTrack.textContent = pad2(currentVideoIndex + 1) + '/' + pad2(playlistVideos.length);
  }

  function nextTrack() {
    if (player && playerReady) {
      player.nextVideo();
    }
  }

  function prevTrack() {
    if (player && playerReady) {
      player.previousVideo();
    }
  }

  function beginPlayback(){
    if (started) return;
    started = true;
    intro.classList.add('hidden');
    dock.classList.add('show');
    trackTitle.textContent = 'Desi Hip Hop Playlist';
    trackArtist.textContent = 'Playlist ready';
    lcdTrack.textContent = '01/01';
    
    if (player && playerReady) {
      player.playVideo();
      playIcon.innerHTML = ICON_PAUSE;
      platter.classList.add('playing');
    }
  }

  // Player controls
  playBtn.addEventListener('click', function(){
    if (!player || !playerReady) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });

  prevBtn.addEventListener('click', prevTrack);
  nextBtn.addEventListener('click', nextTrack);

  vol.addEventListener('input', function(){
    if (player && playerReady) {
      player.setVolume(parseInt(this.value));
    }
  });

  muteBtn.addEventListener('click', function(){
    if (!player || !playerReady) return;
    isMuted = !isMuted;
    if (isMuted) {
      lastVol = player.getVolume();
      player.mute();
    } else {
      player.unMute();
      player.setVolume(lastVol);
    }
  });

  seek.addEventListener('input', function(){
    isSeeking = true;
  });

  seek.addEventListener('change', function(){
    if (!player || !playerReady) return;
    var seekTime = (parseInt(this.value) / 100) * player.getDuration();
    player.seekTo(seekTime);
    isSeeking = false;
  });

  // Update progress bar
  setInterval(function(){
    if (!player || !playerReady || isSeeking) return;
    var current = player.getCurrentTime();
    var duration = player.getDuration();
    
    if (duration > 0) {
      seek.value = (current / duration) * 100;
      curTime.textContent = fmt(current);
      durTime.textContent = fmt(duration);
    }
  }, 500);

  // Initialize playlist info display
  trackTitle.textContent = 'Desi Hip Hop Playlist';
  trackArtist.textContent = 'Tap the intro to load the mix';
  lcdTrack.textContent = '01/01';

  introCard.addEventListener('click', beginPlayback);
  introCard.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); beginPlayback(); }
  });
})();
</script>
</body>
</html>
